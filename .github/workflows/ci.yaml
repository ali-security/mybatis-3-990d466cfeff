name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven test selector (e.g. -Dtest=FooTest)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 17, 21, 22-ea]
        distribution: ['temurin']
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          cache: maven
      - name: Print JDK Version
        run: java -version
      - name: Cache local Maven m2
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2
      - name: Set argLine command line option
        if: ${{ matrix.java == '11' }}
        run: echo 'ARG_LINE=-D"argLine=--illegal-access=permit"' >> $GITHUB_ENV
      - name: Run all tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.java == '11' }}
        run: echo 'ARG_LINE=-D"excludedGroups="' >> $GITHUB_ENV
      - name: Skip tests that require illegal reflective access
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.java != '11' }}
        run: echo 'ARG_LINE=-D"excludedGroups=RequireIllegalAccess"' >> $GITHUB_ENV
      - name: Skip tests that require illegal reflective access
        if: ${{ matrix.os != 'ubuntu-latest' && matrix.java != '11' }}
        run: echo 'ARG_LINE=-D"excludedGroups=TestcontainersTests,RequireIllegalAccess"' >> $GITHUB_ENV
      - name: Pin docker-java API version for Testcontainers (runner Docker 29 rejects API 1.32)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: echo 'api.version=1.44' > "$HOME/.docker-java.properties"
      - name: Active Profiles
        run: ./mvnw help:active-profiles
      - name: Test with Maven
        if: ${{ matrix.os != 'windows-latest' }}
        run: ./mvnw test -B -V  --no-transfer-progress -D"license.skip=true" -D"jacoco.skip=true" $ARG_LINE ${{ inputs.test-filter }}
      - name: Test with Maven
        if: ${{ matrix.os == 'windows-latest' && matrix.java == '11' }}
        run: ./mvnw test -B -V  --no-transfer-progress -D"license.skip=true" -D"jacoco.skip=true" -D"argLine=--illegal-access=permit" ${{ inputs.test-filter }}
      - name: Test with Maven
        if: ${{ matrix.os == 'windows-latest' && matrix.java != '11' }}
        run: ./mvnw test -B -V  --no-transfer-progress -D"license.skip=true" -D"jacoco.skip=true" -D"excludedGroups=TestcontainersTests,RequireIllegalAccess" ${{ inputs.test-filter }}
      - name: Package jar
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.java == '11' }}
        run: ./mvnw package -DskipTests -B -V --no-transfer-progress -D"license.skip=true" -D"jacoco.skip=true"
      - name: Upload jar
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.java == '11' }}
        uses: actions/upload-artifact@v4
        with:
          name: mybatis-jar
          path: target/mybatis-3.5.15.jar
          if-no-files-found: error
      - name: Test summary and skipped-test report
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          skipped = []
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  if tc.find("failure") is not None: fail += 1
                  if tc.find("error") is not None: err += 1
                  s = tc.find("skipped")
                  if s is not None:
                      skip += 1
                      reason = (s.get("message") or (s.text or "").strip() or "@Disabled with no reason string in source").replace("\n", " ")
                      skipped.append("%s.%s: %s" % (tc.get("classname"), tc.get("name"), reason))
          print("=== Surefire summary: tests=%d passed=%d failures=%d errors=%d skipped=%d ===" % (total, total - fail - err - skip, fail, err, skip))
          print("=== Skipped tests (upstream @Disabled / excluded group) with reasons ===")
          for line in skipped:
              print("SKIPPED " + line)
          print("NOT SELECTED (upstream CI matrix excludedGroups, not counted above): TestcontainersTests need a Docker daemon (run on ubuntu legs only); RequireIllegalAccess need --illegal-access=permit (run on JDK 11 legs only)")
